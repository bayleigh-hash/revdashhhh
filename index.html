<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short Form King Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');
  :root {
    --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e;
    --accent-green: #00e5a0; --accent-blue: #4d9fff;
    --accent-amber: #ffb84d; --accent-red: #ff5f5f;
    --text: #f0f0f8; --muted: #6b6b8a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; padding: 24px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 999px; font-family: 'DM Mono', monospace; font-size: 10px; cursor: pointer; transition: all 0.15s; }
  .preset-btn:hover, .preset-btn.active { border-color: var(--accent-green); color: var(--accent-green); background: rgba(0,229,160,0.06); }
  .date-row { display: flex; align-items: center; gap: 8px; }
  .date-sep { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .date-input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px; padding: 5px 10px; outline: none; transition: border-color 0.2s; color-scheme: dark; width: 130px; }
  .date-input:focus { border-color: var(--accent-green); }
  .refresh-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .refresh-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }
  .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .divider { height: 1px; background: var(--border); margin-bottom: 16px; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; overflow: hidden; opacity: 0; transform: translateY(8px); animation: fadeUp 0.4s ease forwards; }
  .stat-card:nth-child(1) { animation-delay: 0.05s; }
  .stat-card:nth-child(2) { animation-delay: 0.1s; }
  .stat-card:nth-child(3) { animation-delay: 0.15s; }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .stat-card.green::before { background: var(--accent-green); }
  .stat-card.blue::before { background: var(--accent-blue); }
  .stat-card.amber::before { background: var(--accent-amber); }
  .stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .stat-value { font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 500; line-height: 1; margin-bottom: 6px; }
  .stat-card.green .stat-value { color: var(--accent-green); }
  .stat-card.blue .stat-value { color: var(--accent-blue); }
  .stat-card.amber .stat-value { color: var(--accent-amber); }
  .stat-sub { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .progress-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .progress-title { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .progress-pct { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent-green); }
  .progress-track { background: var(--border); border-radius: 999px; height: 6px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-green), #00ffbb); width: 0; transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
  .progress-labels { display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .table-header-row { display: grid; grid-template-columns: 1fr 110px 110px 110px 90px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #0d0d15; }
  .th { font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .table-row { display: grid; grid-template-columns: 1fr 110px 110px 110px 90px; padding: 11px 16px; border-bottom: 1px solid #14141f; align-items: center; transition: background 0.15s; }
  .table-row:last-child { border-bottom: none; }
  .table-row:hover { background: #13131c; }
  .td { font-size: 12px; font-family: 'DM Mono', monospace; }
  .td.name { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; }
  .td.green { color: var(--accent-green); }
  .td.red { color: var(--accent-red); }
  .td.muted { color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .badge.pif { background: rgba(0,229,160,0.12); color: var(--accent-green); border: 1px solid rgba(0,229,160,0.2); }
  .badge.plan { background: rgba(77,159,255,0.12); color: var(--accent-blue); border: 1px solid rgba(77,159,255,0.2); }
  .insight-card { background: linear-gradient(135deg, #0f0f1a, #111120); border: 1px solid #252540; border-radius: 12px; padding: 16px 20px; display: flex; gap: 14px; align-items: flex-start; }
  .insight-icon { width: 28px; height: 28px; background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.2); border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; }
  .insight-text { font-size: 12px; line-height: 1.6; color: #9090b8; font-family: 'DM Mono', monospace; }
  .insight-text strong { color: var(--accent-green); font-weight: 500; }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; padding: 60px 0; justify-content: center; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent-green); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: rgba(255,95,95,0.08); border: 1px solid rgba(255,95,95,0.2); border-radius: 8px; padding: 14px 16px; color: var(--accent-red); font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.6; }
  .last-updated { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-align: right; margin-top: 10px; }
  .empty-state { text-align: center; padding: 40px 0; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="header">
  <h1>Short Form King · Revenue Dashboard</h1>
  <div class="header-right">
    <div class="presets">
      <button class="preset-btn" onclick="setPreset('today', this)">Today</button>
      <button class="preset-btn" onclick="setPreset('week', this)">This Week</button>
      <button class="preset-btn" onclick="setPreset('month', this)">This Month</button>
      <button class="preset-btn" onclick="setPreset('quarter', this)">This Quarter</button>
      <button class="preset-btn active" onclick="setPreset('all', this)">All Time</button>
    </div>
    <div class="date-row">
      <input type="date" class="date-input" id="dateFrom" onchange="onDateChange()">
      <span class="date-sep">→</span>
      <input type="date" class="date-input" id="dateTo" onchange="onDateChange()">
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData()">↺ Refresh</button>
  </div>
</div>
<div class="divider"></div>
<div id="app">
  <div class="loading"><div class="spinner"></div>Fetching live data...</div>
</div>
<script>
const API_KEY     = 'pit-47261410-ad47-4174-8cdf-346820b3533f';
const LOCATION_ID = 'Ssg47DJXtq6t7p6JBLG8';
const CASH_KEY    = 'contact.cash_collected';
const BALANCE_KEY = 'contact.amount_owed';
const REVENUE_KEY = 'contact.revenue_generated';

const fmt = n => 'AU$' + Math.round(n).toLocaleString('en-AU');

function parseAmt(val) {
  if (!val) return 0;
  const n = parseFloat(String(val).replace(/[^0-9.]/g, ''));
  return isNaN(n) ? 0 : n;
}

function getFieldByKey(opp, key) {
  // Check opportunity customFields first, then full contact data
  const allFields = [
    ...(opp.customFields || []),
    ...(opp.contactData?.customFields || []),
    ...(opp.contact?.customFields || [])
  ];
  const f = allFields.find(f => f.fieldKey === key || f.id === key);
  return f ? (f.fieldValueString || f.value || '') : '';
}

function toDateStr(d) { return d.toISOString().split('T')[0]; }

function setPreset(preset, el) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const now = new Date();
  let from = '', to = '';
  if (preset === 'today') { from = to = toDateStr(now); }
  else if (preset === 'week') { const d = new Date(now); d.setDate(d.getDate() - d.getDay() + (d.getDay() === 0 ? -6 : 1)); from = toDateStr(d); to = toDateStr(now); }
  else if (preset === 'month') { from = toDateStr(new Date(now.getFullYear(), now.getMonth(), 1)); to = toDateStr(now); }
  else if (preset === 'quarter') { const q = Math.floor(now.getMonth() / 3); from = toDateStr(new Date(now.getFullYear(), q * 3, 1)); to = toDateStr(now); }
  document.getElementById('dateFrom').value = from;
  document.getElementById('dateTo').value = to;
  loadData();
}

function onDateChange() {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  loadData();
}

async function fetchAllOpps() {
  let all = [], startAfter = null, startAfterId = null;
  while (true) {
    let url = `https://services.leadconnectorhq.com/opportunities/search?location_id=${LOCATION_ID}&status=all&limit=100`;
    if (startAfter) url += `&startAfter=${startAfter}`;
    if (startAfterId) url += `&startAfterId=${startAfterId}`;
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${API_KEY}`, 'Version': '2021-07-28' } });
    if (!res.ok) throw new Error(`GHL API error ${res.status}: ${res.statusText}`);
    const data = await res.json();
    const opps = data.opportunities || [];
    all = all.concat(opps);
    if (opps.length < 100 || !data.meta?.startAfterId) break;
    startAfter = data.meta.startAfter;
    startAfterId = data.meta.startAfterId;
  }
  return all;
}

async function fetchContact(contactId) {
  const res = await fetch(`https://services.leadconnectorhq.com/contacts/${contactId}`, {
    headers: { 'Authorization': `Bearer ${API_KEY}`, 'Version': '2021-07-28' }
  });
  if (!res.ok) return null;
  const data = await res.json();
  return data.contact || null;
}

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '↺ Loading...';
  document.getElementById('app').innerHTML = '<div class="loading"><div class="spinner"></div>Fetching live data...</div>';

  const fromVal = document.getElementById('dateFrom').value;
  const toVal = document.getElementById('dateTo').value;
  const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
  const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;

  try {
    let opportunities = await fetchAllOpps();

    // Enrich each opp with full contact data (for custom fields)
    const VALID_TAGS = ['14k pif', '21k pif', 'payment plan'];
    opportunities = opportunities.filter(o => {
      const tags = (o.contact?.tags || []).map(t => t.toLowerCase());
      return VALID_TAGS.some(vt => tags.includes(vt));
    });

    // Fetch full contact details in batches of 5 to get custom fields
    const enriched = [];
    for (let i = 0; i < opportunities.length; i += 5) {
      const batch = opportunities.slice(i, i + 5);
      const contacts = await Promise.all(batch.map(o => fetchContact(o.contactId)));
      batch.forEach((o, idx) => {
        if (contacts[idx]) o.contactData = contacts[idx];
        enriched.push(o);
      });
    }
    opportunities = enriched;

    if (fromDate || toDate) {
      opportunities = opportunities.filter(o => {
        const d = new Date(o.lastStageChangeAt || o.createdAt);
        if (fromDate && d < fromDate) return false;
        if (toDate && d > toDate) return false;
        return true;
      });
    }

    let totalRevenue = 0, totalCash = 0, totalBalance = 0;
    opportunities.forEach(o => {
      totalRevenue += parseAmt(getFieldByKey(o, REVENUE_KEY));
      totalCash    += parseAmt(getFieldByKey(o, CASH_KEY));
      totalBalance += parseAmt(getFieldByKey(o, BALANCE_KEY));
    });

    const rate = totalRevenue > 0 ? ((totalCash / totalRevenue) * 100).toFixed(1) : 0;
    const pifCount  = opportunities.filter(o => { const t = (o.contact?.tags || []).map(x => x.toLowerCase()); return t.includes('14k pif') || t.includes('21k pif'); }).length;
    const planCount = opportunities.filter(o => { const t = (o.contact?.tags || []).map(x => x.toLowerCase()); return t.includes('payment plan'); }).length;
    const now = new Date().toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' });
    const rangeLabel = fromVal && toVal ? `${fromVal} → ${toVal}` : fromVal ? `From ${fromVal}` : toVal ? `To ${toVal}` : 'All time';

    const tableRows = opportunities.length === 0
      ? `<div class="empty-state">No deals found for this date range</div>`
      : opportunities.map(o => {
          const cash    = parseAmt(getFieldByKey(o, CASH_KEY));
          const balance = parseAmt(getFieldByKey(o, BALANCE_KEY));
          const revenue = parseAmt(getFieldByKey(o, REVENUE_KEY));
          const tags    = (o.contact?.tags || []).map(t => t.toLowerCase());
          const isPif   = tags.includes('14k pif') || tags.includes('21k pif');
          const badge   = isPif ? '<span class="badge pif">PIF</span>' : '<span class="badge plan">Plan</span>';
          return `
          <div class="table-row">
            <span class="td name">${o.name || '—'}</span>
            <span class="td muted">${fmt(revenue)}</span>
            <span class="td green">${fmt(cash)}</span>
            <span class="td ${balance > 0 ? 'red' : 'muted'}">${balance > 0 ? fmt(balance) : '—'}</span>
            <span class="td">${badge}</span>
          </div>`;
        }).join('');

    document.getElementById('app').innerHTML = `
      <div class="stats-row">
        <div class="stat-card green">
          <div class="stat-label">Cash Collected</div>
          <div class="stat-value">${fmt(totalCash)}</div>
          <div class="stat-sub">${rate}% of revenue · ${rangeLabel}</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-label">Revenue Generated</div>
          <div class="stat-value">${fmt(totalRevenue)}</div>
          <div class="stat-sub">${opportunities.length} deals · ${rangeLabel}</div>
        </div>
        <div class="stat-card amber">
          <div class="stat-label">Balance Owing</div>
          <div class="stat-value">${fmt(totalBalance)}</div>
          <div class="stat-sub">${planCount} on payment plans</div>
        </div>
      </div>
      <div class="progress-card">
        <div class="progress-header">
          <span class="progress-title">Collection Rate · Cash vs Revenue</span>
          <span class="progress-pct">${rate}%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-labels"><span>${fmt(totalCash)} collected</span><span>${fmt(totalRevenue)} total</span></div>
      </div>
      <div class="table-card">
        <div class="table-header-row">
          <span class="th">Client</span>
          <span class="th">Revenue</span>
          <span class="th">Collected</span>
          <span class="th">Owing</span>
          <span class="th">Status</span>
        </div>
        ${tableRows}
      </div>
      <div class="insight-card">
        <div class="insight-icon">◈</div>
        <div class="insight-text">
          <strong>${pifCount} clients</strong> paid in full ·
          <strong>${planCount} clients</strong> on payment plans ·
          <strong>${fmt(totalBalance)}</strong> outstanding to collect
        </div>
      </div>
      <div class="last-updated">Live data · ${rangeLabel} · Updated: ${now}</div>
    `;

    setTimeout(() => {
      const fill = document.getElementById('progressFill');
      if (fill) fill.style.width = Math.min(rate, 100) + '%';
    }, 100);

  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="error">⚠ Error: ${e.message}</div>`;
  }

  btn.disabled = false;
  btn.textContent = '↺ Refresh';
}

loadData();
</script>
</body>
</html>
